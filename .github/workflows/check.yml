name: Static application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.12.0'
      - name: Install the pinned package manager
        run: npm install --global pnpm@12.11.2 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm check-reader
      - run: pnpm check-ascii
      - run: pnpm check-types
      - run: pnpm build
      - run: pnpm check-site-builds
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm check-cloudflare
